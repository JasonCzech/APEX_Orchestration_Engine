# Dev infrastructure only — pair with `make dev` (langgraph dev) or alembic runs.
services:
  postgres:
    image: postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
    environment:
      POSTGRES_USER: apex
      POSTGRES_PASSWORD: apex
      POSTGRES_DB: apex
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U apex"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine@sha256:6ab0b6e7381779332f97b8ca76193e45b0756f38d4c0dcda72dbb3c32061ab99
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: nginxinc/nginx-unprivileged:1.31.2-alpine3.23@sha256:6320020c7da8714feab524e02c08c5a1958675c4e68700e93a2fd8970b065786
    ports:
      - "127.0.0.1:9000:9000"
    volumes:
      - ./deploy/minio-gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9000/minio/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 10

  # No network-visible raw S3/console listener: all callers use the gateway.
  #
  # Development uses the archived Bitnami build pinned below. Keep the previous
  # server's root user for existing miniodata volumes: their root-owned .minio.sys
  # files are not writable by the replacement image's default uid 1001. The volume
  # contents stay in place; the mount uses Bitnami's declared data directory.
  # This compatibility override is limited to local development.
  minio-storage:
    image: bitnamilegacy/minio:2025.7.23-debian-12-r5@sha256:6dabb4a2088c9a79908de3bc05f4586c23ad2182c8908e7e3acbf61c1467fb20
    network_mode: "service:minio"
    user: "0:0"
    entrypoint: ["minio"]
    command: server /bitnami/minio/data --address 127.0.0.1:9100 --console-address 127.0.0.1:9101
    environment:
      MINIO_ROOT_USER: apex
      MINIO_ROOT_PASSWORD: apex-minio
    volumes:
      - miniodata:/bitnami/minio/data

volumes:
  pgdata:
  miniodata:
